<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03070a">
<meta name="description" content="A post from the ZUMS Computer Society blog.">
<title>Post — ZUMS Computer Society</title>
<link rel="icon" href="assets/img/club-logo.png" type="image/png">
<link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/fonts.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="blog" data-base="" data-area="site">

<a class="skip-link" href="#main">Skip to content</a>
<div id="site-nav"></div>

<main id="main">
  <div id="postHero"></div>

  <section class="section">
    <div class="shell">
      <div class="row g-5">
        <div class="col-12 col-lg-8">
          <img id="postCover" src="" alt="" style="width:100%;border:1px solid var(--line);margin-bottom:30px">
          <article class="prose" id="postBody"></article>

          <div class="rule" style="margin:36px 0"></div>

          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
            <img id="postAvatar" src="" alt="" style="width:54px;height:54px;border-radius:50%;border:1px solid var(--line-2)">
            <div>
              <p class="mono" style="font-size:10.5px;color:var(--ink-3);margin:0">Written by</p>
              <p style="margin:0;color:#fff;font-family:var(--f-display);font-weight:600" id="postAuthor"></p>
            </div>
            <div class="btn-row" style="margin-left:auto">
              <button class="btn-ghost btn-ghost--sm" type="button" id="shareBtn">Copy link</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="panel" style="margin-bottom:22px">
            <div class="panel__head"><div>
              <p class="panel__kicker">Details</p>
              <h2 class="panel__title">This post</h2>
            </div></div>
            <dl class="dl-z" id="postFacts"></dl>
          </div>

          <div class="panel">
            <div class="panel__head"><div>
              <p class="panel__kicker">Keep reading</p>
              <h2 class="panel__title">More from the club</h2>
            </div></div>
            <div id="postMore"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-foot"></div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var D = window.ZCS, U = window.ZCSUI;
  var p = D.postById(U.param('id')) || D.posts[0];

  document.title = p.title + ' — ZUMS Computer Society';

  document.getElementById('postHero').innerHTML =
    '<section class="phero"><div class="shell shell--narrow" style="margin-inline:0;max-width:820px">' +
      '<ul class="crumbs"><li><a href="index.html">Home</a></li><li><a href="blog.html">Blog</a></li><li>' + p.category + '</li></ul>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
        '<span class="tag tag--cyan">' + p.category + '</span>' +
        '<span class="tag">' + p.read + ' min read</span>' +
        '<span class="tag">' + U.fmtDate(p.date) + '</span>' +
      '</div>' +
      '<h1 class="phero__title">' + p.title + '</h1>' +
      '<p class="phero__sub">' + p.excerpt + '</p>' +
    '</div></section>';

  document.getElementById('postCover').src = D.placeholder(p.id, p.category);

  document.getElementById('postBody').innerHTML =
    '<p>' + p.excerpt + '</p>' +
    '<h2>The short version</h2>' +
    '<p>This is placeholder body copy standing in for the real article. When the PHP backend ' +
    'lands, this block is filled from <code>blog_posts.body_html</code> and the surrounding ' +
    'furniture — author, category, read time, published flag — comes from the same row.</p>' +
    '<blockquote>Every mistake is a lesson. The point of writing it down is that it only has to be ' +
    'made once per club, not once per member.</blockquote>' +
    '<h2>What we tried</h2>' +
    '<p>We started with the obvious approach, watched it fall over under real load, and rebuilt it ' +
    'with the constraint we should have written down first. The failure is the interesting part, ' +
    'so it stays in the write-up rather than being edited out.</p>' +
    '<ul><li>The first attempt, and precisely how it broke.</li>' +
    '<li>The measurement that told us which assumption was wrong.</li>' +
    '<li>The fix, and what it cost us elsewhere.</li></ul>' +
    '<h2>Try it yourself</h2>' +
    '<pre><code>git clone https://example.org/zcs/' + p.id + '.git\ncd ' + p.id + '\nmake run</code></pre>' +
    '<p>Bring questions to the wing session — the fastest way to understand this is to break it ' +
    'yourself with somebody sitting next to you.</p>';

  document.getElementById('postAvatar').src = D.avatarFor(p.author);
  document.getElementById('postAuthor').textContent = p.author;

  document.getElementById('postFacts').innerHTML = [
    ['Published', U.fmtDate(p.date)],
    ['Author', p.author],
    ['Category', p.category],
    ['Read time', p.read + ' min']
  ].map(function (f) { return '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>'; }).join('');

  document.getElementById('postMore').innerHTML = D.posts
    .filter(function (x) { return x.id !== p.id; }).slice(0, 4).map(function (x) {
      return '<a href="post.html?id=' + x.id + '" style="display:block;padding:11px 0;border-bottom:1px solid var(--line)">' +
        '<span class="mono" style="font-size:10.5px;color:var(--ink-3);display:block">' + x.category + ' · ' + x.read + ' min</span>' +
        '<span style="color:#fff;font-family:var(--f-display);font-weight:600;font-size:.94rem">' + x.title + '</span></a>';
    }).join('');

  document.getElementById('shareBtn').setAttribute('data-copy', window.location.href);
})();
</script>
</body>
</html>
